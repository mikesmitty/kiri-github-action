name: Test Action

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    # Docker testing
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@885d1462b80bc1c1c7f0b00334ad271f09369c55 # v2
      with:
        driver: docker
    - name: Log in to GHCR
      uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc # v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build version
      uses: docker/build-push-action@0a97817b6ade9f46837855d676c4cca3a2471fc9 # v4
      with:
        push: true
        tags: ghcr.io/${{ github.repository_owner }}/kiri:${{ github.sha }}
    - name: Modify action.yml to use local image
      run: |
        sed -i "s#ghcr.io/${{ github.repository_owner }}/kiri:__KIRI_VERSION__#ghcr.io/${{ github.repository_owner }}/kiri:${{ github.sha }}#g" action.yml
    # Action testing
    - name: Clone SnekSafe for testing
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        repository: USA-RedDragon/SnekSafe
        path: SnekSafe
    - name: Test Local Action
      uses: ./
      with:
        project-file: SnekSafe/kicad/sneksafe.kicad_pro
        output-dir: SnekSafe/kicad/.kiri
    - name: Ensure output directory was created
      run: |
        ls -l SnekSafe/kicad/.kiri
    - name: Ensure output files were created
      run: |
        ls -l SnekSafe/kicad/.kiri/web/index.html
    - name: Delete ci image from GHCR
      if: always()
      run: |
        curl -X DELETE -H "Accept: application/vnd.github.v3+json" -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/${{ github.repository_owner }}/kiri/packages/container/kiri/versions/${{ github.sha }}
